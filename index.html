<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>素材探しの錬金RPG</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --accent: #22d3ee;
      --accent-2: #a78bfa;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --ok: #4ade80;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: radial-gradient(circle at 20% 20%, #1e293b 0%, var(--bg) 45%);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      gap: 16px;
      grid-template-columns: 1.4fr 1fr;
    }
    .panel {
      background: linear-gradient(160deg, rgba(31,41,55,.95), rgba(17,24,39,.96));
      border: 1px solid #334155;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(0,0,0,.35);
      padding: 14px;
    }
    h1, h2, h3 { margin: 0 0 8px; }
    h1 { font-size: 1.3rem; }
    h2 { font-size: 1.05rem; color: #c7d2fe; }
    .status-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .stat {
      background: var(--panel);
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 8px;
      text-align: center;
    }
    .stat .label { color: var(--muted); font-size: .8rem; }
    .stat .value { font-size: 1.1rem; font-weight: 700; }

    .map {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .tile {
      border-radius: 12px;
      border: 1px solid #334155;
      min-height: 92px;
      padding: 6px;
      background: #0b1220;
      position: relative;
      transition: transform .15s ease, border-color .2s ease;
      cursor: pointer;
    }
    .tile:hover { transform: translateY(-2px); border-color: var(--accent); }
    .tile.current { outline: 2px solid var(--accent-2); }
    .tile .name { font-size: .8rem; font-weight: 700; margin-top: 4px; }
    .tile .risk { font-size: .72rem; color: #fda4af; }

    .illus {
      width: 100%;
      height: 52px;
      display: block;
      border-radius: 8px;
      background: #0f172a;
      border: 1px solid #374151;
    }

    .actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      border: 1px solid #334155;
      background: #0b1220;
      color: var(--text);
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: linear-gradient(120deg, #0e7490, #4338ca); }

    .list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
      max-height: 270px;
      overflow: auto;
    }
    .card {
      background: var(--panel);
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 8px;
      display: grid;
      grid-template-columns: 54px 1fr auto;
      gap: 8px;
      align-items: center;
    }
    .card small { color: var(--muted); }

    .log {
      height: 180px;
      overflow: auto;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 8px;
      font-size: .9rem;
      line-height: 1.45;
    }
    .ok { color: var(--ok); }
    .warn { color: var(--warn); }
    .hpbar {
      margin-top: 8px;
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: #1f2937;
      overflow: hidden;
      border: 1px solid #334155;
    }
    .hpbar > div {
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #16a34a);
      width: 100%;
      transition: width .2s ease;
    }

    @media (max-width: 980px) {
      .wrap { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="panel">
      <h1>🌟 素材探しの錬金RPG（探索＋合成）</h1>
      <div class="status-grid">
        <div class="stat"><div class="label">Lv</div><div class="value" id="lv"></div></div>
        <div class="stat"><div class="label">EXP</div><div class="value" id="exp"></div></div>
        <div class="stat"><div class="label">HP</div><div class="value" id="hp"></div></div>
        <div class="stat"><div class="label">Gold</div><div class="value" id="gold"></div></div>
      </div>
      <div class="hpbar"><div id="hpFill"></div></div>

      <h2 style="margin-top:12px;">探索マップ</h2>
      <div class="map" id="map"></div>
      <div class="actions">
        <button class="primary" id="exploreBtn">🧭 現在地を探索</button>
        <button id="restBtn">🏕 宿で休む（20G）</button>
        <button id="sellBtn">💰 薬を売る（所持分）</button>
      </div>
    </section>

    <section class="panel">
      <h2>🎒 素材インベントリ</h2>
      <div id="inventory" class="list"></div>

      <h2 style="margin-top:12px;">⚗️ 合成（レシピ）</h2>
      <div id="recipes" class="list"></div>

      <h2 style="margin-top:12px;">📜 ログ</h2>
      <div class="log" id="log"></div>
    </section>
  </div>

  <script>
    const state = {
      lv: 1,
      exp: 0,
      expNext: 16,
      hp: 100,
      maxHp: 100,
      gold: 35,
      area: 0,
      items: {
        薬草: 0,
        清水: 0,
        火トカゲの尻尾: 0,
        鉄鉱石: 0,
        月花: 0,
        樹液: 0,
        回復薬: 0,
        上級回復薬: 0,
        爆炎瓶: 0
      }
    };

    const areas = [
      { name: '始まりの草原', risk: 6, pool: ['薬草','清水','樹液'], art: 'grass' },
      { name: '霧の森', risk: 11, pool: ['薬草','月花','樹液'], art: 'forest' },
      { name: '赤熱洞窟', risk: 18, pool: ['火トカゲの尻尾','鉄鉱石','清水'], art: 'cave' },
      { name: '月影の湿地', risk: 14, pool: ['月花','清水','薬草'], art: 'swamp' },
      { name: '竜骨の渓谷', risk: 22, pool: ['鉄鉱石','火トカゲの尻尾','月花'], art: 'valley' }
    ];

    const recipes = [
      { name: '回復薬', make: '回復薬', gain: 1, needs: { 薬草: 2, 清水: 1 }, price: 28 },
      { name: '上級回復薬', make: '上級回復薬', gain: 1, needs: { 回復薬: 1, 月花: 1, 樹液: 1 }, price: 65 },
      { name: '爆炎瓶', make: '爆炎瓶', gain: 1, needs: { 火トカゲの尻尾: 2, 鉄鉱石: 1, 樹液: 1 }, price: 84 }
    ];

    const el = id => document.getElementById(id);

    const iconSVG = (kind) => {
      const base = {
        grass: '<svg viewBox="0 0 120 60" class="illus" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="60" fill="#052e16"/><circle cx="95" cy="14" r="9" fill="#fde68a"/><path d="M5 55 L20 30 L32 55 Z" fill="#22c55e"/><path d="M26 55 L40 22 L53 55 Z" fill="#16a34a"/><path d="M50 55 L64 28 L76 55 Z" fill="#4ade80"/><path d="M72 55 L90 26 L105 55 Z" fill="#15803d"/></svg>',
        forest: '<svg viewBox="0 0 120 60" class="illus" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="60" fill="#0f172a"/><rect y="38" width="120" height="22" fill="#064e3b"/><circle cx="23" cy="26" r="12" fill="#14532d"/><rect x="20" y="28" width="6" height="20" fill="#78350f"/><circle cx="58" cy="22" r="14" fill="#166534"/><rect x="54" y="25" width="7" height="22" fill="#78350f"/><circle cx="96" cy="26" r="12" fill="#15803d"/><rect x="93" y="29" width="6" height="19" fill="#78350f"/></svg>',
        cave: '<svg viewBox="0 0 120 60" class="illus" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="60" fill="#111827"/><path d="M0 60 L16 18 L34 40 L52 14 L66 35 L82 10 L100 30 L120 16 L120 60 Z" fill="#374151"/><ellipse cx="56" cy="50" rx="23" ry="8" fill="#0b1020"/><circle cx="92" cy="20" r="5" fill="#f97316"/></svg>',
        swamp: '<svg viewBox="0 0 120 60" class="illus" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="60" fill="#1e293b"/><rect y="36" width="120" height="24" fill="#155e75"/><ellipse cx="24" cy="44" rx="15" ry="6" fill="#67e8f9" opacity="0.5"/><ellipse cx="68" cy="48" rx="18" ry="6" fill="#99f6e4" opacity="0.4"/><path d="M92 36 L99 20 L106 36 Z" fill="#84cc16"/><rect x="98" y="35" width="2" height="16" fill="#a16207"/></svg>',
        valley: '<svg viewBox="0 0 120 60" class="illus" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="60" fill="#172554"/><path d="M0 54 L24 24 L44 54 Z" fill="#334155"/><path d="M30 54 L60 18 L84 54 Z" fill="#475569"/><path d="M66 54 L94 28 L120 54 Z" fill="#1e293b"/><circle cx="98" cy="15" r="8" fill="#c4b5fd"/></svg>',
        itemHerb: '<svg viewBox="0 0 54 54" class="illus" xmlns="http://www.w3.org/2000/svg"><rect width="54" height="54" rx="8" fill="#052e16"/><path d="M27 40 C18 31, 18 22, 27 14 C36 22, 36 31, 27 40" fill="#4ade80"/><rect x="25" y="20" width="4" height="21" fill="#16a34a"/></svg>',
        itemWater: '<svg viewBox="0 0 54 54" class="illus" xmlns="http://www.w3.org/2000/svg"><rect width="54" height="54" rx="8" fill="#082f49"/><path d="M27 12 C34 23, 38 28, 38 34 C38 40,33 44,27 44 C21 44,16 40,16 34 C16 28,20 23,27 12" fill="#38bdf8"/></svg>',
        itemTail: '<svg viewBox="0 0 54 54" class="illus" xmlns="http://www.w3.org/2000/svg"><rect width="54" height="54" rx="8" fill="#431407"/><path d="M12 36 C18 18,30 17,42 12 C37 22,30 32,18 41 Z" fill="#f97316"/></svg>',
        itemOre: '<svg viewBox="0 0 54 54" class="illus" xmlns="http://www.w3.org/2000/svg"><rect width="54" height="54" rx="8" fill="#111827"/><polygon points="27,10 42,20 35,42 18,42 12,22" fill="#94a3b8"/></svg>',
        itemMoon: '<svg viewBox="0 0 54 54" class="illus" xmlns="http://www.w3.org/2000/svg"><rect width="54" height="54" rx="8" fill="#312e81"/><circle cx="27" cy="27" r="11" fill="#e9d5ff"/><circle cx="32" cy="24" r="10" fill="#8b5cf6"/></svg>',
        itemSap: '<svg viewBox="0 0 54 54" class="illus" xmlns="http://www.w3.org/2000/svg"><rect width="54" height="54" rx="8" fill="#451a03"/><ellipse cx="27" cy="28" rx="11" ry="14" fill="#f59e0b"/></svg>',
        potion: '<svg viewBox="0 0 54 54" class="illus" xmlns="http://www.w3.org/2000/svg"><rect width="54" height="54" rx="8" fill="#0f172a"/><rect x="23" y="8" width="8" height="8" fill="#cbd5e1"/><path d="M18 16 H36 V22 C36 26 40 30 40 36 C40 43 34 46 27 46 C20 46 14 43 14 36 C14 30 18 26 18 22 Z" fill="#22c55e"/></svg>',
        superPotion: '<svg viewBox="0 0 54 54" class="illus" xmlns="http://www.w3.org/2000/svg"><rect width="54" height="54" rx="8" fill="#111827"/><rect x="23" y="8" width="8" height="8" fill="#cbd5e1"/><path d="M18 16 H36 V22 C36 26 40 30 40 36 C40 43 34 46 27 46 C20 46 14 43 14 36 C14 30 18 26 18 22 Z" fill="#a855f7"/></svg>',
        bomb: '<svg viewBox="0 0 54 54" class="illus" xmlns="http://www.w3.org/2000/svg"><rect width="54" height="54" rx="8" fill="#0b1220"/><circle cx="27" cy="31" r="13" fill="#fb7185"/><rect x="24" y="15" width="6" height="7" fill="#cbd5e1"/><path d="M29 15 C34 11,36 10,40 12" stroke="#facc15" stroke-width="2" fill="none"/></svg>'
      };
      return base[kind] ?? base.grass;
    };

    const itemIconKind = (name) => ({
      '薬草':'itemHerb','清水':'itemWater','火トカゲの尻尾':'itemTail','鉄鉱石':'itemOre','月花':'itemMoon','樹液':'itemSap','回復薬':'potion','上級回復薬':'superPotion','爆炎瓶':'bomb'
    }[name]);

    function renderMap() {
      const map = el('map');
      map.innerHTML = '';
      areas.forEach((a, i) => {
        const d = document.createElement('div');
        d.className = 'tile' + (i === state.area ? ' current' : '');
        d.innerHTML = `${iconSVG(a.art)}<div class="name">${a.name}</div><div class="risk">危険度: ${a.risk}</div>`;
        d.onclick = () => {
          state.area = i;
          log(`移動: ${a.name} へ向かった。`);
          render();
        };
        map.appendChild(d);
      });
    }

    function renderInventory() {
      const inv = el('inventory');
      inv.innerHTML = '';
      Object.entries(state.items).forEach(([name, qty]) => {
        if (qty <= 0) return;
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `${iconSVG(itemIconKind(name))}<div><b>${name}</b><br><small>所持数: ${qty}</small></div>`;
        inv.appendChild(card);
      });
      if (!inv.children.length) {
        inv.innerHTML = '<div class="card"><div></div><div><small>まだ素材がありません。探索しよう！</small></div></div>';
      }
    }

    function canCraft(needs) {
      return Object.entries(needs).every(([k,v]) => (state.items[k] || 0) >= v);
    }

    function craft(recipe) {
      if (!canCraft(recipe.needs)) {
        log(`素材不足: ${recipe.name} を作れない。`, 'warn');
        return;
      }
      for (const [name, n] of Object.entries(recipe.needs)) state.items[name] -= n;
      state.items[recipe.make] = (state.items[recipe.make] || 0) + recipe.gain;
      gainExp(4);
      log(`合成成功: ${recipe.name} を作成！`, 'ok');
      render();
    }

    function renderRecipes() {
      const list = el('recipes');
      list.innerHTML = '';
      recipes.forEach(r => {
        const card = document.createElement('div');
        card.className = 'card';
        const needsText = Object.entries(r.needs).map(([k,v]) => `${k}×${v}`).join(' / ');
        const ok = canCraft(r.needs);
        card.innerHTML = `${iconSVG(itemIconKind(r.make))}<div><b>${r.name}</b><br><small>${needsText}<br>売値: ${r.price}G</small></div>`;
        const b = document.createElement('button');
        b.textContent = ok ? '合成する' : '不足';
        b.disabled = !ok;
        b.onclick = () => craft(r);
        card.appendChild(b);
        list.appendChild(card);
      });
    }

    function gainExp(v) {
      state.exp += v;
      while (state.exp >= state.expNext) {
        state.exp -= state.expNext;
        state.lv++;
        state.expNext = Math.round(state.expNext * 1.35);
        state.maxHp += 10;
        state.hp = state.maxHp;
        log(`レベルアップ！ Lv.${state.lv} になった。HP全快。`, 'ok');
      }
    }

    function explore() {
      const area = areas[state.area];
      const roll = Math.random();
      if (roll < 0.24) {
        const dmg = Math.max(3, Math.round(area.risk * (0.6 + Math.random())));
        state.hp -= dmg;
        log(`敵に遭遇！ ${dmg} ダメージを受けた。`, 'warn');
        if (state.hp <= 0) {
          state.hp = 1;
          const lost = Math.min(state.gold, 15);
          state.gold -= lost;
          log(`気絶したが街に救助。所持金 ${lost}G を失った…。`, 'warn');
        }
      } else {
        const mat = area.pool[Math.floor(Math.random() * area.pool.length)];
        const n = Math.random() < 0.2 ? 2 : 1;
        state.items[mat] += n;
        gainExp(3 + Math.floor(area.risk / 7));
        log(`採取成功: ${mat} を ${n} 個入手！`, 'ok');
      }
      render();
    }

    function rest() {
      if (state.gold < 20) {
        log('お金不足で宿に泊まれない。', 'warn');
        return;
      }
      state.gold -= 20;
      state.hp = state.maxHp;
      log('宿で休んでHPが全快した。');
      render();
    }

    function sellPotions() {
      let gained = 0;
      recipes.forEach(r => {
        const n = state.items[r.make] || 0;
        if (n > 0) {
          gained += n * r.price;
          state.items[r.make] = 0;
        }
      });
      if (gained === 0) {
        log('売れる薬がない。先に合成しよう。', 'warn');
        return;
      }
      state.gold += gained;
      gainExp(Math.round(gained / 16));
      log(`調合品を売却して ${gained}G 獲得！`, 'ok');
      render();
    }

    function log(text, klass = '') {
      const box = el('log');
      const line = document.createElement('div');
      if (klass) line.className = klass;
      line.textContent = `• ${text}`;
      box.prepend(line);
    }

    function renderTop() {
      el('lv').textContent = state.lv;
      el('exp').textContent = `${state.exp} / ${state.expNext}`;
      el('hp').textContent = `${state.hp} / ${state.maxHp}`;
      el('gold').textContent = `${state.gold} G`;
      el('hpFill').style.width = `${Math.max(0, (state.hp / state.maxHp) * 100)}%`;
    }

    function render() {
      renderTop();
      renderMap();
      renderInventory();
      renderRecipes();
    }

    el('exploreBtn').onclick = explore;
    el('restBtn').onclick = rest;
    el('sellBtn').onclick = sellPotions;

    render();
    log('冒険開始！探索で素材を集め、合成して売って強くなろう。');
  </script>
</body>
</html>
