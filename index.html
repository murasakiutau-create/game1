<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>遺跡探索クラシックRPG</title>
  <style>
    :root {
      --bg:#020617;
      --panel:#000;
      --line:#d1d5db;
      --text:#f8fafc;
      --hp:#22c55e;
      --mp:#38bdf8;
      --warn:#f59e0b;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:#111827;
      color:var(--text);
      font-family:"MS Gothic","Yu Gothic",monospace;
    }
    .screen{
      max-width:1200px;
      margin:0 auto;
      padding:8px;
      display:grid;
      grid-template-rows:auto auto;
      gap:8px;
      min-height:100vh;
    }
    .frame{
      border:4px solid #e5e7eb;
      border-radius:12px;
      background:var(--panel);
      box-shadow:inset 0 0 0 2px #111827;
      overflow:hidden;
    }
    .top{
      display:grid;
      grid-template-columns:2fr 1fr;
      gap:8px;
      min-height:52vh;
    }
    .map-wrap{ position:relative; background:#000; }
    #mapCanvas{ width:100%; height:100%; display:block; image-rendering:pixelated; }
    .area-label{
      position:absolute;
      top:10px; left:10px;
      border:3px solid var(--line);
      border-radius:10px;
      background:rgba(0,0,0,.9);
      padding:8px 12px;
      font-size:1.2rem;
      letter-spacing:1px;
    }

    .status{
      display:grid;
      grid-template-rows:auto 1fr auto;
      background:#030712;
    }
    .status h2{
      margin:0;
      padding:10px;
      border-bottom:3px solid var(--line);
      font-size:1.1rem;
    }
    .party-list{ padding:8px; display:grid; gap:8px; overflow:auto; }
    .member{ border:2px solid var(--line); border-radius:8px; padding:6px; background:#000; }
    .member-top{ display:flex; justify-content:space-between; align-items:center; }
    .bars{ margin-top:4px; display:grid; gap:4px; }
    .bar{ height:10px; border:1px solid #64748b; background:#0f172a; }
    .bar > div{ height:100%; }
    .hp{ background:var(--hp); }
    .mp{ background:var(--mp); }
    .gold{ border-top:3px solid var(--line); padding:10px; font-size:1.4rem; text-align:center; }

    .bottom{
      display:grid;
      grid-template-columns:2fr 1fr;
      gap:8px;
      min-height:42vh;
    }
    .battle-col{ display:grid; grid-template-rows:1fr auto auto; gap:8px; }
    .battle-stage{
      position:relative;
      background:radial-gradient(circle at 50% 10%, #374151 0%, #111827 55%, #000 100%);
      display:flex;
      align-items:flex-end;
      justify-content:center;
      gap:40px;
      padding:24px;
    }
    .enemy{
      font-size:64px;
      filter: drop-shadow(0 6px 0 rgba(0,0,0,.5));
      transition:transform .15s;
    }
    .enemy.hit{ transform:translateY(-6px) scale(1.08); }
    .message{ padding:10px; font-size:1.15rem; line-height:1.55; min-height:82px; white-space:pre-line; }

    .cmd-row{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .menu{ padding:8px; display:grid; gap:6px; }
    button{
      border:2px solid var(--line);
      border-radius:8px;
      background:#000;
      color:var(--text);
      padding:8px;
      font-family:inherit;
      font-size:1.05rem;
      text-align:left;
    }
    button.active, button:hover{ background:#1e293b; }

    .log{ padding:8px; overflow:auto; }
    .log h3{ margin:0 0 8px; border-bottom:2px solid var(--line); padding-bottom:4px; }
    .log-entry{ margin:0 0 4px; }
    .warn{ color:var(--warn); }

    .mobile-pad{ display:none; grid-template-columns:repeat(3,56px); gap:6px; justify-content:center; padding:8px; }
    .mobile-pad button{ text-align:center; }

    @media (max-width: 980px){
      .top, .bottom{ grid-template-columns:1fr; }
      .screen{ min-height:auto; }
      .map-wrap{ min-height:340px; }
      .battle-stage{ min-height:190px; }
      .mobile-pad{ display:grid; }
    }
  </style>
</head>
<body>
  <div class="screen">
    <section class="top">
      <div class="frame map-wrap">
        <canvas id="mapCanvas" width="768" height="480"></canvas>
        <div class="area-label" id="areaLabel">古びた地下遺跡 B1F</div>
      </div>

      <aside class="frame status">
        <h2>パーティステータス</h2>
        <div id="partyList" class="party-list"></div>
        <div class="gold" id="gold">1250 G</div>
      </aside>
    </section>

    <section class="bottom">
      <div class="battle-col">
        <div class="frame battle-stage" id="battleStage"></div>
        <div class="frame message" id="message"></div>
        <div class="cmd-row">
          <div class="frame menu" id="commandMenu"></div>
          <div class="frame menu" id="subMenu"></div>
        </div>
        <div class="mobile-pad">
          <div></div><button data-move="up">↑</button><div></div>
          <button data-move="left">←</button><button id="actBtn">決定</button><button data-move="right">→</button>
          <div></div><button data-move="down">↓</button><div></div>
        </div>
      </div>

      <div class="frame log" id="log">
        <h3>ログ</h3>
      </div>
    </section>
  </div>

  <script>
    const TILE = 32;
    const MAP_W = 24;
    const MAP_H = 15;

    const tiles = { VOID:0, FLOOR:1, WALL:2, STAIRS:3, CHEST:4, WATER:5 };
    const palette = {
      0:'#000000',
      1:'#475569',
      2:'#374151',
      3:'#d97706',
      4:'#f59e0b',
      5:'#1d4ed8'
    };

    const party = [
      { name:'アレス', job:'戦士', lv:16, hp:120, maxHp:120, mp:36, maxMp:36, atk:22, icon:'🛡️' },
      { name:'リリア', job:'魔法使い', lv:16, hp:80, maxHp:80, mp:52, maxMp:52, atk:14, icon:'🔮' },
      { name:'マックス', job:'盗賊', lv:17, hp:150, maxHp:150, mp:18, maxMp:18, atk:20, icon:'🗡️' },
      { name:'セリナ', job:'僧侶', lv:16, hp:90, maxHp:90, mp:78, maxMp:78, atk:12, icon:'✨' }
    ];

    const state = {
      gold:1250,
      floor:1,
      map:[],
      player:{ x:2, y:2 },
      mode:'explore',
      encounterRate:0.11,
      enemies:[],
      message:'↑↓←→ で移動。宝箱と階段を探そう。',
      selectedCommand:0
    };

    const commandList = ['たたかう','まほう','どうぐ','にげる'];
    const mapCanvas = document.getElementById('mapCanvas');
    const ctx = mapCanvas.getContext('2d');

    function log(text, cls='') {
      const box = document.getElementById('log');
      const d = document.createElement('div');
      d.className = `log-entry ${cls}`;
      d.textContent = `• ${text}`;
      box.appendChild(d);
      box.scrollTop = box.scrollHeight;
    }

    function setMessage(text) {
      state.message = text;
      document.getElementById('message').textContent = text;
    }

    function generateDungeon() {
      state.map = Array.from({length:MAP_H}, () => Array(MAP_W).fill(tiles.VOID));
      const rooms = [];

      for (let i=0;i<6;i++) {
        const rw = 4 + Math.floor(Math.random()*4);
        const rh = 3 + Math.floor(Math.random()*4);
        const rx = 1 + Math.floor(Math.random()*(MAP_W-rw-2));
        const ry = 1 + Math.floor(Math.random()*(MAP_H-rh-2));
        rooms.push({x:rx,y:ry,w:rw,h:rh,cx:rx+Math.floor(rw/2),cy:ry+Math.floor(rh/2)});

        for (let y=ry;y<ry+rh;y++) {
          for (let x=rx;x<rx+rw;x++) state.map[y][x]=tiles.FLOOR;
        }
      }

      for (let i=1;i<rooms.length;i++) {
        const a = rooms[i-1], b = rooms[i];
        for (let x=Math.min(a.cx,b.cx); x<=Math.max(a.cx,b.cx); x++) state.map[a.cy][x]=tiles.FLOOR;
        for (let y=Math.min(a.cy,b.cy); y<=Math.max(a.cy,b.cy); y++) state.map[y][b.cx]=tiles.FLOOR;
      }

      for (let y=1;y<MAP_H-1;y++) {
        for (let x=1;x<MAP_W-1;x++) {
          if (state.map[y][x]!==tiles.VOID) {
            for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++) {
              if (state.map[y+dy][x+dx]===tiles.VOID) state.map[y+dy][x+dx]=tiles.WALL;
            }
          }
        }
      }

      rooms.slice(0,3).forEach(r => { state.map[r.cy][r.cx] = tiles.CHEST; });
      const last = rooms[rooms.length-1];
      state.map[last.cy][last.cx] = tiles.STAIRS;
      state.player.x = rooms[0].cx;
      state.player.y = rooms[0].cy;

      const waterRoom = rooms[1] || rooms[0];
      for (let y=waterRoom.y+1; y<waterRoom.y+waterRoom.h-1; y++) {
        for (let x=waterRoom.x+1; x<waterRoom.x+waterRoom.w-1; x++) {
          if (Math.random() < 0.4 && state.map[y][x] === tiles.FLOOR) state.map[y][x] = tiles.WATER;
        }
      }
    }

    function drawMap() {
      const w = mapCanvas.width / MAP_W;
      const h = mapCanvas.height / MAP_H;
      ctx.clearRect(0,0,mapCanvas.width,mapCanvas.height);

      for (let y=0;y<MAP_H;y++) {
        for (let x=0;x<MAP_W;x++) {
          const t = state.map[y][x];
          ctx.fillStyle = palette[t] || '#000';
          ctx.fillRect(x*w,y*h,w,h);
          if (t===tiles.WALL) {
            ctx.fillStyle='rgba(0,0,0,.35)';
            ctx.fillRect(x*w,y*h,w,5);
          }
          if (t===tiles.WATER) {
            ctx.fillStyle='rgba(255,255,255,.15)';
            ctx.fillRect(x*w,y*h,w,2);
          }
          if (t===tiles.CHEST) {
            ctx.fillStyle='#fbbf24';
            ctx.fillRect(x*w+8,y*h+8,w-16,h-16);
          }
        }
      }

      const px = state.player.x*w;
      const py = state.player.y*h;
      ctx.fillStyle='#93c5fd';
      ctx.fillRect(px+8,py+6,w-16,h-12);
      ctx.fillStyle='#1e3a8a';
      ctx.fillRect(px+11,py+h-12,w-22,8);
    }

    function renderParty() {
      const root = document.getElementById('partyList');
      root.innerHTML = '';
      party.forEach(m => {
        const node = document.createElement('div');
        node.className = 'member';
        node.innerHTML = `
          <div class="member-top"><b>${m.icon} ${m.name}</b><span>${m.job} Lv${m.lv}</span></div>
          <div class="bars">
            <div>HP ${m.hp}/${m.maxHp}<div class="bar"><div class="hp" style="width:${(m.hp/m.maxHp)*100}%"></div></div></div>
            <div>MP ${m.mp}/${m.maxMp}<div class="bar"><div class="mp" style="width:${(m.mp/m.maxMp)*100}%"></div></div></div>
          </div>`;
        root.appendChild(node);
      });
      document.getElementById('gold').textContent = `${state.gold} G`;
      document.getElementById('areaLabel').textContent = `古びた地下遺跡 B${state.floor}F`;
    }

    function renderMenus() {
      const menu = document.getElementById('commandMenu');
      menu.innerHTML = '';
      commandList.forEach((name, idx) => {
        const b = document.createElement('button');
        b.textContent = `▶ ${name}`;
        if (state.selectedCommand === idx) b.classList.add('active');
        b.onclick = () => runCommand(idx);
        menu.appendChild(b);
      });

      const sub = document.getElementById('subMenu');
      if (state.mode === 'explore') {
        sub.innerHTML = `
          <button id="hintBtn">しらべる</button>
          <button id="descBtn">このゲームについて</button>
          <button id="healBtn">全体回復(10G)</button>`;
        document.getElementById('hintBtn').onclick = inspectTile;
        document.getElementById('descBtn').onclick = () => setMessage('クラシックRPG風UIデモ。探索→遭遇→コマンド戦闘の流れです。');
        document.getElementById('healBtn').onclick = healParty;
      } else {
        sub.innerHTML = '<button onclick="window.advanceTurn()">ターン進行</button><button onclick="window.escapeBattle()">にげる</button>';
      }
    }

    function healParty() {
      if (state.gold < 10) return setMessage('お金が足りない。');
      state.gold -= 10;
      party.forEach(m => { m.hp = Math.min(m.maxHp, m.hp+25); m.mp = Math.min(m.maxMp, m.mp+12); });
      setMessage('薬草を使って回復した。');
      renderParty();
      log('パーティを回復した。');
    }

    function inspectTile() {
      const t = state.map[state.player.y][state.player.x];
      if (t === tiles.CHEST) setMessage('宝箱がある。決定キー(Enter)で開ける。');
      else if (t === tiles.STAIRS) setMessage('下り階段だ。決定キーで次のフロアへ。');
      else if (t === tiles.WATER) setMessage('水場だ。足元が滑りやすい。');
      else setMessage('石造りの通路が続いている。');
    }

    function canWalk(x,y){
      if (x<0||y<0||x>=MAP_W||y>=MAP_H) return false;
      const t = state.map[y][x];
      return t !== tiles.VOID && t !== tiles.WALL;
    }

    function move(dx,dy){
      if (state.mode !== 'explore') return;
      const nx = state.player.x + dx;
      const ny = state.player.y + dy;
      if (!canWalk(nx,ny)) return;
      state.player.x = nx; state.player.y = ny;
      drawMap();

      if (Math.random() < state.encounterRate) startBattle();
    }

    function interact(){
      if (state.mode === 'battle') {
        runCommand(0);
        return;
      }
      const t = state.map[state.player.y][state.player.x];
      if (t === tiles.CHEST) {
        const g = 30 + Math.floor(Math.random()*90);
        state.gold += g;
        state.map[state.player.y][state.player.x] = tiles.FLOOR;
        setMessage(`宝箱を開けた！ ${g}G を手に入れた。`);
        log(`${g}G を入手。`);
        renderParty(); drawMap();
      } else if (t === tiles.STAIRS) {
        state.floor += 1;
        state.encounterRate = Math.min(0.2, state.encounterRate + 0.01);
        generateDungeon();
        setMessage(`B${state.floor}F に降りた…`);
        log(`フロア移動: B${state.floor}F`);
        renderAll();
      } else {
        inspectTile();
      }
    }

    function randomEnemy(){
      const table = [
        {name:'スライムA', hp:35, atk:8, icon:'💧'},
        {name:'ゴブリン', hp:55, atk:11, icon:'👹'},
        {name:'スケルトン', hp:50, atk:12, icon:'💀'},
        {name:'コウモリ', hp:28, atk:9, icon:'🦇'}
      ];
      return {...table[Math.floor(Math.random()*table.length)]};
    }

    function startBattle(){
      state.mode = 'battle';
      state.enemies = [randomEnemy(), randomEnemy()].filter((_,i)=> i===0 || Math.random()>0.35);
      setMessage(state.enemies.map(e => `${e.name} が あらわれた！`).join('\n'));
      renderBattle();
      renderMenus();
      log('敵と遭遇した！', 'warn');
    }

    function renderBattle(){
      const stage = document.getElementById('battleStage');
      stage.innerHTML = '';
      if (state.mode !== 'battle') {
        stage.innerHTML = '<div style="font-size:1.4rem;opacity:.85;">探索中…（敵に遭遇するとここに表示）</div>';
        return;
      }
      state.enemies.forEach(e => {
        const d = document.createElement('div');
        d.className = 'enemy';
        d.textContent = e.icon;
        d.title = `${e.name} HP:${e.hp}`;
        stage.appendChild(d);
      });
    }

    function runCommand(idx){
      if (state.mode !== 'battle') {
        state.selectedCommand = idx;
        const text = ['探索中は移動して敵を探そう。','戦闘中に使える。','道具は開発中。','探索中。'][idx];
        setMessage(text);
        renderMenus();
        return;
      }

      if (idx === 3) return escapeBattle();
      if (idx === 2) return setMessage('どうぐは現在調整中…');
      if (idx === 1) {
        const mage = party[1];
        if (mage.mp < 8) return setMessage('MPが足りない！');
        mage.mp -= 8;
        const dmg = 24 + Math.floor(Math.random()*12);
        state.enemies.forEach(e => e.hp -= dmg);
        setMessage(`リリアのファイア！ 全体に ${dmg} ダメージ！`);
        animateHit();
      } else {
        const alive = party.filter(p => p.hp > 0);
        const target = state.enemies[0];
        const sumAtk = alive.reduce((a,b)=>a+b.atk,0);
        const dmg = Math.round(sumAtk * (0.45 + Math.random()*0.3));
        target.hp -= dmg;
        setMessage(`総攻撃！ ${target.name} に ${dmg} ダメージ！`);
        animateHit();
      }

      state.enemies = state.enemies.filter(e => e.hp > 0);
      if (!state.enemies.length) return winBattle();
      enemyTurn();
      renderParty();
      renderBattle();
    }

    function animateHit(){
      document.querySelectorAll('.enemy').forEach(el => {
        el.classList.add('hit');
        setTimeout(() => el.classList.remove('hit'), 120);
      });
    }

    function enemyTurn(){
      const alive = party.filter(p => p.hp > 0);
      state.enemies.forEach(e => {
        const t = alive[Math.floor(Math.random()*alive.length)];
        const dmg = Math.max(5, Math.round(e.atk * (0.6 + Math.random()*0.6)));
        t.hp = Math.max(0, t.hp - dmg);
        log(`${e.name} の攻撃！ ${t.name} に ${dmg} ダメージ`, 'warn');
      });
      if (party.every(p => p.hp <= 0)) {
        party.forEach(p => p.hp = Math.round(p.maxHp*0.4));
        state.gold = Math.max(0, state.gold - 120);
        state.mode = 'explore';
        setMessage('全滅した…街へ戻され、120Gを失った。');
        log('全滅して撤退した。', 'warn');
        renderAll();
      }
    }

    function winBattle(){
      const g = 40 + Math.floor(Math.random()*55) + state.floor*8;
      state.gold += g;
      party.forEach(p => {
        if (p.hp > 0) {
          p.hp = Math.min(p.maxHp, p.hp + 6);
          p.mp = Math.min(p.maxMp, p.mp + 3);
        }
      });
      state.mode = 'explore';
      setMessage(`勝利！ ${g}G を手に入れた。`);
      log(`戦闘勝利。${g}G 獲得。`);
      renderAll();
    }

    function escapeBattle(){
      if (state.mode !== 'battle') return;
      if (Math.random() < 0.65) {
        state.mode = 'explore';
        setMessage('うまく逃げ切った。');
        log('戦闘から離脱した。');
        renderAll();
      } else {
        setMessage('逃げられない！');
        enemyTurn();
        renderParty();
      }
    }

    function renderAll(){
      drawMap();
      renderParty();
      renderBattle();
      renderMenus();
      document.getElementById('message').textContent = state.message;
    }

    window.advanceTurn = () => runCommand(0);
    window.escapeBattle = escapeBattle;

    document.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'arrowup' || k === 'w') move(0,-1);
      else if (k === 'arrowdown' || k === 's') move(0,1);
      else if (k === 'arrowleft' || k === 'a') move(-1,0);
      else if (k === 'arrowright' || k === 'd') move(1,0);
      else if (k === 'enter' || k === ' ') interact();
      else if (k === '1') runCommand(0);
      else if (k === '2') runCommand(1);
      else if (k === '3') runCommand(2);
      else if (k === '4') runCommand(3);
    });

    document.querySelectorAll('[data-move]').forEach(btn => {
      const dir = btn.dataset.move;
      const map = {up:[0,-1], down:[0,1], left:[-1,0], right:[1,0]};
      const fn = () => move(...map[dir]);
      btn.onclick = fn;
      btn.addEventListener('touchstart', (e)=>{ e.preventDefault(); fn(); }, {passive:false});
    });
    document.getElementById('actBtn').onclick = interact;

    generateDungeon();
    renderAll();
    log('遺跡探索を開始。');
  </script>
</body>
</html>
