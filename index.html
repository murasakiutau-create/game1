<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>星降る村の小さな冒険 - RPGツクール風HTML RPG</title>
  <style>
    :root{
      --ink:#1d1b2e;
      --paper:#fff8dc;
      --panel:#10223f;
      --panel2:#071426;
      --line:#f3e8b0;
      --accent:#ffd166;
      --good:#7bd88f;
      --bad:#ff6b6b;
      --sky:#6ec6ff;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#0b1024;color:#fff;font-family:"MS Gothic","Yu Gothic",monospace;}
    body{
      display:grid;place-items:center;padding:18px;
      background:
        radial-gradient(circle at 20% 10%, rgba(110,198,255,.18), transparent 28%),
        radial-gradient(circle at 80% 0%, rgba(255,209,102,.14), transparent 24%),
        linear-gradient(180deg,#08152f,#0b1024 54%,#070914);
    }
    .shell{width:min(1100px,100%);display:grid;gap:12px;}
    header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
    h1{margin:0;color:var(--accent);font-size:clamp(22px,4vw,36px);text-shadow:3px 3px 0 #000;letter-spacing:.06em;}
    .help{margin:0;color:#dce7ff;font-size:14px;line-height:1.6;}
    .game{display:grid;grid-template-columns:minmax(320px,736px) 1fr;gap:12px;align-items:start;}
    .screen-card,.side-card,.message-box,.controls{border:4px solid var(--line);background:var(--panel2);box-shadow:0 10px 0 rgba(0,0,0,.35), inset 0 0 0 3px #000;border-radius:10px;}
    .screen-card{position:relative;overflow:hidden;background:#000;}
    canvas{display:block;width:100%;image-rendering:pixelated;aspect-ratio:23/15;background:#000;}
    .place{position:absolute;left:12px;top:12px;padding:6px 10px;border:3px solid #fff;background:rgba(0,0,0,.78);border-radius:8px;text-shadow:2px 2px #000;}
    .side-card{padding:12px;display:grid;gap:12px;}
    .status-title{margin:0;color:var(--accent);font-size:20px;border-bottom:2px solid #44628f;padding-bottom:6px;}
    .stat{display:grid;gap:5px;background:#12284a;border:2px solid #44628f;border-radius:8px;padding:10px;}
    .stat-row{display:flex;justify-content:space-between;gap:8px;}
    .meter{height:14px;border:2px solid #071426;background:#02050a;border-radius:7px;overflow:hidden;}
    .meter>i{display:block;height:100%;background:linear-gradient(90deg,#26d07c,#c5f467);}
    .meter.mp>i{background:linear-gradient(90deg,#4cc9f0,#90e0ef)}
    .inventory{display:flex;flex-wrap:wrap;gap:8px;}
    .chip{padding:6px 8px;background:#08152f;border:2px solid #44628f;border-radius:999px;}
    .message-box{min-height:92px;padding:14px 16px;font-size:18px;line-height:1.55;white-space:pre-line;}
    .hud{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;}
    .controls{padding:10px;display:grid;gap:8px;}
    .buttons{display:grid;grid-template-columns:repeat(3,50px);gap:6px;justify-content:center;}
    button{font:inherit;color:#fff;background:#14335f;border:3px solid #cfe5ff;border-radius:8px;padding:10px;box-shadow:0 4px 0 #000;cursor:pointer;}
    button:hover,button:focus{background:#23508d;outline:2px solid var(--accent);}
    button:active{transform:translateY(2px);box-shadow:0 2px 0 #000;}
    .wide{grid-column:span 3;}
    .legend{font-size:13px;color:#dce7ff;line-height:1.6;}
    .asset-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
    .asset{background:#08152f;border:2px solid #44628f;border-radius:8px;padding:6px;text-align:center;font-size:12px;color:#dce7ff;}
    .asset canvas{width:48px;height:48px;margin:auto;aspect-ratio:1/1;}
    .flash{animation:flash .25s steps(2) 3}
    @keyframes flash{50%{filter:brightness(2.4) saturate(1.8)}}
    @media(max-width:850px){.game,.hud{grid-template-columns:1fr}.controls{order:-1}.message-box{font-size:16px}.buttons{grid-template-columns:repeat(3,56px)}}
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>星降る村の小さな冒険</h1>
        <p class="help">RPGツクール風のタイルマップ、ドット絵アセット、村人会話、宝箱、戦闘を1枚のHTMLで実装。</p>
      </div>
      <p class="help">移動: 矢印/WASD　決定: Space/Enter</p>
    </header>

    <section class="game">
      <div class="screen-card" id="screenCard">
        <canvas id="game" width="736" height="480" aria-label="RPG game screen"></canvas>
        <div class="place" id="place">星降る村</div>
      </div>

      <aside class="side-card">
        <h2 class="status-title">勇者メニュー</h2>
        <div class="stat">
          <div class="stat-row"><b>ルナ</b><span>Lv <span id="lv">1</span></span></div>
          <div>HP <span id="hpText"></span></div><div class="meter"><i id="hpBar"></i></div>
          <div>MP <span id="mpText"></span></div><div class="meter mp"><i id="mpBar"></i></div>
          <div class="stat-row"><span>GOLD</span><b id="gold">0G</b></div>
        </div>
        <div>
          <h2 class="status-title">もちもの</h2>
          <div class="inventory" id="items"></div>
        </div>
        <div>
          <h2 class="status-title">ドット絵アセット</h2>
          <div class="asset-strip" id="assetStrip"></div>
        </div>
        <p class="legend">草むらはランダムエンカウント、看板・村人・宝箱・階段は正面で決定。宿屋で回復できます。</p>
      </aside>
    </section>

    <section class="hud">
      <div class="message-box" id="message">ようこそ、星降る村へ。まずは村人に話しかけてみよう。</div>
      <div class="controls">
        <div class="buttons">
          <span></span><button data-dir="up">↑</button><span></span>
          <button data-dir="left">←</button><button id="action">決定</button><button data-dir="right">→</button>
          <span></span><button data-dir="down">↓</button><span></span>
          <button class="wide" id="restart">はじめから</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    const TILE = 32;
    const W = 23;
    const H = 15;
    const tiles = {
      '.':'grass', ',':'flower', '#':'tree', '=':'path', '~':'water', 'H':'house', 'I':'inn', 'S':'sign', 'C':'chest', '^':'stairs', 'N':'npc', 'M':'monster'
    };
    const mapRows = [
      '#######################',
      '#....,,,,....#....C...#',
      '#..H..====...#..~~~...#',
      '#.....=S==......~~~...#',
      '#..N..====...#........#',
      '#.........####....#####',
      '#..====.........,,,...#',
      '#..=II=..~~~~....M....#',
      '#..====..~~~~.........#',
      '#........~~~~....====.#',
      '#####............=^^=.#',
      '#...C..,,........====.#',
      '#.......,,..N.........#',
      '#.....................#',
      '#######################'
    ];
    let map = mapRows.map(row => [...row]);

    const player = {x:3,y:12,dir:'down',step:0,lv:1,hp:38,maxHp:38,mp:12,maxMp:12,gold:80,items:['薬草']};
    const npcs = {
      '4,4':['村人ポポ','北の宝箱には旅立ちの石があるよ。草むらの魔物には気をつけて！'],
      '11,12':['賢者ミト','階段の先には星の欠片が眠る。HPが減ったら宿屋へ戻るのじゃ。']
    };
    const passable = new Set(['.',',','=','S','C','^','N','M']);
    const messages = {
      S:'看板「星降る村　←宿屋　→星見の丘」',
      H:'小さな家だ。煙突からパンの香りがする。',
      I:'宿屋で休んだ。HPとMPが全回復！',
      '^':'石段の向こうに星明かりの洞窟が見える。まだHTML版の続きは準備中。'
    };

    const sprites = {
      hero:[
        '000222000','002222200','006666600','066776660','066666660','003333000','033333300','030303030','000404000','004040400','040000040','000000000'
      ],
      npc:[
        '000555000','005555500','008888800','088998880','088888880','000777000','007777700','070707070','000606000','006060600','060000060','000000000'
      ],
      slime:[
        '000000000','000000000','000aaa000','00aaaaa00','0aabbaa0','0aaaaaa0','00a99a00','000aa000','000000000'
      ],
      chest:[
        '000000000','00bbbb000','0bccccb00','0bddddb00','0bccccb00','0bcdccb00','0bbbbbb00','000000000'
      ],
      star:[
        '000d00000','000d00000','0dddddd00','00ddd000','00ddd000','0dd0dd000','0d000d000','000000000'
      ],
      tree:[
        '000e00000','00eee0000','0eeeee000','00eee0000','0eeeee000','eee0eee00','000f00000','000f00000'
      ]
    };
    const pal = {0:null,2:'#243b8f',3:'#2f7d32',4:'#6b3f1d',5:'#8c5fbf',6:'#5ac8fa',7:'#f4c2c2',8:'#f4a261',9:'#111',a:'#76d275',b:'#6b3f1d',c:'#d18b2f',d:'#ffe066',e:'#1f9d55',f:'#7a4a22'};

    function drawPixelSprite(pattern, x, y, scale=3, flip=false){
      pattern.forEach((row, ry) => [...row].forEach((key, rx) => {
        const color = pal[key];
        if(!color) return;
        ctx.fillStyle = color;
        const px = flip ? x + (row.length - 1 - rx) * scale : x + rx * scale;
        ctx.fillRect(px, y + ry * scale, scale, scale);
      }));
    }

    function drawTile(kind, x, y){
      const px=x*TILE, py=y*TILE;
      if(kind === 'grass' || kind === 'flower'){
        ctx.fillStyle = '#55b957'; ctx.fillRect(px,py,TILE,TILE);
        ctx.fillStyle = '#3f9f45'; for(let i=0;i<4;i++) ctx.fillRect(px+((x*11+i*9)%28), py+((y*7+i*13)%28), 4, 4);
        if(kind==='flower'){ctx.fillStyle='#ffd166';ctx.fillRect(px+10,py+8,4,4);ctx.fillStyle='#ff70a6';ctx.fillRect(px+22,py+20,4,4)}
      }
      if(kind === 'path'){
        ctx.fillStyle = '#c49a6c'; ctx.fillRect(px,py,TILE,TILE);
        ctx.fillStyle = '#a87c52'; ctx.fillRect(px+2,py+26,8,3); ctx.fillRect(px+18,py+8,10,3);
      }
      if(kind === 'tree'){
        ctx.fillStyle = '#236b3b'; ctx.fillRect(px,py,TILE,TILE);
        drawPixelSprite(sprites.tree, px+2, py+4, 3);
      }
      if(kind === 'water'){
        ctx.fillStyle = '#2477c7'; ctx.fillRect(px,py,TILE,TILE);
        ctx.fillStyle = '#8de4ff'; ctx.fillRect(px+4,py+10+(x+y)%6,12,3); ctx.fillRect(px+18,py+22-(x%3),10,3);
      }
      if(kind === 'house' || kind === 'inn'){
        ctx.fillStyle = '#55b957'; ctx.fillRect(px,py,TILE,TILE);
        ctx.fillStyle = kind==='inn' ? '#cc2936' : '#8d5524'; ctx.fillRect(px+3,py+9,26,18);
        ctx.fillStyle = '#f5d6a0'; ctx.fillRect(px+7,py+15,7,7); ctx.fillRect(px+18,py+15,7,12);
        ctx.fillStyle = '#5e2b12'; ctx.fillRect(px+1,py+5,30,7);
      }
      if(kind === 'sign'){
        drawTile('grass',x,y); ctx.fillStyle='#7a4a22'; ctx.fillRect(px+14,py+14,4,14); ctx.fillStyle='#d9a441'; ctx.fillRect(px+7,py+8,18,10);
      }
      if(kind === 'chest'){
        drawTile('grass',x,y); drawPixelSprite(sprites.chest, px+3, py+6, 3);
      }
      if(kind === 'stairs'){
        drawTile('path',x,y); ctx.fillStyle='#6b7280'; for(let i=0;i<4;i++) ctx.fillRect(px+6+i*3,py+8+i*5,20-i*4,4);
      }
      if(kind === 'npc'){
        drawTile('grass',x,y); drawPixelSprite(sprites.npc, px+3, py+0, 3);
      }
      if(kind === 'monster'){
        drawTile('grass',x,y); drawPixelSprite(sprites.slime, px+3, py+8, 3);
      }
    }

    function draw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      for(let y=0;y<H;y++) for(let x=0;x<W;x++) drawTile(tiles[map[y][x]],x,y);
      drawPixelSprite(sprites.hero, player.x*TILE+3, player.y*TILE+0, 3, player.dir==='left');
      ctx.fillStyle='rgba(0,0,0,.28)'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.strokeStyle='rgba(255,255,255,.08)';
      for(let x=0;x<=W;x++){ctx.beginPath();ctx.moveTo(x*TILE,0);ctx.lineTo(x*TILE,H*TILE);ctx.stroke();}
      for(let y=0;y<=H;y++){ctx.beginPath();ctx.moveTo(0,y*TILE);ctx.lineTo(W*TILE,y*TILE);ctx.stroke();}
    }

    function front(){
      const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[player.dir];
      return {x:player.x+d[0], y:player.y+d[1]};
    }
    function say(text){document.getElementById('message').textContent=text;}
    function at(x,y){return map[y]?.[x] || '#';}
    function move(dir){
      player.dir = dir;
      const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[dir];
      const nx=player.x+d[0], ny=player.y+d[1];
      const tile = at(nx,ny);
      if(passable.has(tile) && tile !== 'N' && tile !== 'C' && tile !== 'S' && tile !== 'M'){
        player.x=nx; player.y=ny; player.step++;
        if(tile===',' && Math.random()<0.18) battle(false);
        else say('草の匂いと8bitの風が流れている。');
      } else if(tile==='#') say('木が道をふさいでいる。');
      else if(tile==='~') say('水が深くて渡れない。');
      else say('正面を調べるには決定ボタン。');
      draw(); updateUi();
    }
    function action(){
      const f=front(); const tile=at(f.x,f.y);
      if(tile==='N') return say(npcs[`${f.x},${f.y}`]?.join('「') + '」');
      if(tile==='C') { map[f.y][f.x]='.'; player.gold+=120; player.items.push('星の欠片'); say('宝箱を開けた！ 120Gと星の欠片を手に入れた。'); }
      else if(tile==='I'){ player.hp=player.maxHp; player.mp=player.maxMp; say(messages.I); }
      else if(tile==='M'){ battle(true); map[f.y][f.x]='.'; }
      else if(messages[tile]) say(messages[tile]);
      else say('そこには何もない。');
      draw(); updateUi();
    }
    function battle(fixed){
      const enemy = fixed ? '森のスライムキング' : 'ぷるぷるスライム';
      const dmg = fixed ? 13 : 7;
      const reward = fixed ? 160 : 35;
      const screen = document.getElementById('screenCard');
      screen.classList.add('flash'); setTimeout(()=>screen.classList.remove('flash'), 800);
      if(player.hp > dmg + 5){
        player.hp -= dmg; player.gold += reward; player.lv += fixed ? 1 : 0;
        say(`${enemy}があらわれた！\nルナの勇気の一撃！ 勝利した。${reward}Gを獲得。`);
      } else {
        player.hp = Math.max(1, Math.floor(player.maxHp/2));
        player.gold = Math.max(0, player.gold-20);
        say(`${enemy}に押し戻された……。村の入口まで退却し、20Gを落とした。`);
        player.x=3; player.y=12;
      }
    }
    function updateUi(){
      document.getElementById('lv').textContent=player.lv;
      document.getElementById('hpText').textContent=`${player.hp}/${player.maxHp}`;
      document.getElementById('mpText').textContent=`${player.mp}/${player.maxMp}`;
      document.getElementById('hpBar').style.width=`${player.hp/player.maxHp*100}%`;
      document.getElementById('mpBar').style.width=`${player.mp/player.maxMp*100}%`;
      document.getElementById('gold').textContent=`${player.gold}G`;
      document.getElementById('items').innerHTML=player.items.map(i=>`<span class="chip">${i}</span>`).join('');
    }
    function restart(){ location.reload(); }

    addEventListener('keydown', e=>{
      const key=e.key.toLowerCase();
      const dir={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'}[key];
      if(dir){ e.preventDefault(); move(dir); }
      if(key===' ' || key==='enter'){ e.preventDefault(); action(); }
    });
    document.querySelectorAll('[data-dir]').forEach(btn=>btn.addEventListener('click',()=>move(btn.dataset.dir)));
    document.getElementById('action').addEventListener('click', action);
    document.getElementById('restart').addEventListener('click', restart);

    function drawAssetPreview(){
      const assets=[['勇者',sprites.hero],['村人',sprites.npc],['スライム',sprites.slime],['宝箱',sprites.chest],['星',sprites.star],['木',sprites.tree]];
      const strip=document.getElementById('assetStrip');
      for(const [name,pattern] of assets){
        const box=document.createElement('div'); box.className='asset';
        const c=document.createElement('canvas'); c.width=48; c.height=48;
        const temp=c.getContext('2d'); temp.imageSmoothingEnabled=false;
        box.appendChild(c); box.append(name); strip.appendChild(box);
        pattern.forEach((row, ry) => [...row].forEach((key, rx) => { if(pal[key]){ temp.fillStyle=pal[key]; temp.fillRect(rx*5+2, ry*4+2, 5, 5); } }));
      }
    }
    drawAssetPreview(); updateUi(); draw();
  </script>
</body>
</html>
